<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}邮件 AI 助手{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=20260814-5">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="/" aria-label="邮件 AI 助手首页">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span><strong>邮件 AI 助手</strong><small>MAIL READER / 01</small></span>
      </a>
      <nav class="primary-nav">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}"><span>01</span>工作台</a>
        <a href="/reports" class="{% if request.url.path == '/reports' %}active{% endif %}"><span>02</span>历史报告</a>
        <a href="/important-mails" class="{% if request.url.path == '/important-mails' %}active{% endif %}"><span>03</span>重要邮件</a>
        <a href="/read-mails" class="{% if request.url.path == '/read-mails' %}active{% endif %}"><span>04</span>已读管理</a>
        <a href="/docs"><span>05</span>接口文档</a>
      </nav>
      <div class="privacy-note">
        <span class="status-dot" aria-hidden="true"></span>
        <div><strong>邮箱只读</strong><p>本地已读不会修改服务器状态</p></div>
      </div>
    </aside>
    <div class="page-shell">
      <header class="mobile-header">
        <a class="mobile-brand" href="/">邮件 AI 助手</a>
<nav aria-label="移动导航"><a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>工作台</a><a href="/reports" {% if request.url.path.startswith('/reports') %}aria-current="page"{% endif %}>报告</a><a href="/important-mails" {% if request.url.path == '/important-mails' %}aria-current="page"{% endif %}>重要</a><a href="/read-mails" {% if request.url.path == '/read-mails' %}aria-current="page"{% endif %}>已读</a></nav>
      </header>
      <main id="main-content" class="page-content">{% block content %}{% endblock %}</main>
      <footer class="site-footer"><span>LOCAL-FIRST MAIL INTELLIGENCE</span><span>纯只读 IMAP · SQLite 快照</span></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js?v=20260814-6"></script>
</body>
</html>
